<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 영화 티어리스트</title>
<style>
  :root {
    --bg: #10131b;
    --panel: #191e2a;
    --panel-2: #202737;
    --line: #30394b;
    --text: #f4f6fb;
    --muted: #a4aec0;
    --accent: #9b8cff;
    --life: #f2bd55;
    --watch: #65c9a6;
    --no: #ed7e83;
    --shadow: 0 14px 34px rgba(0,0,0,.22);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--text);
    background: radial-gradient(circle at 12% 0%, #24243d 0, transparent 34%), var(--bg);
    font-family: Pretendard, "Noto Sans KR", "Malgun Gothic", sans-serif;
  }
  .wrap { max-width: 1440px; margin: 0 auto; padding: 34px 38px 42px; }
  header { display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin-bottom:28px; }
  .eyebrow { color:var(--accent); font-size:12px; font-weight:800; letter-spacing:.16em; margin-bottom:9px; }
  h1 { margin:0; font-size:clamp(27px,3vw,38px); letter-spacing:-.045em; }
  .subtitle { color:var(--muted); margin:10px 0 0; font-size:14px; }
  .summary { display:flex; gap:10px; flex-wrap:wrap; }
  .summary span { background:rgba(255,255,255,.06); border:1px solid var(--line); padding:10px 14px; border-radius:12px; color:var(--muted); font-size:13px; }
  .summary b { color:var(--text); margin-left:5px; }
  .guide { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:13px; margin:0 0 18px; }
  .guide .dot { width:7px;height:7px;border-radius:50%;background:var(--accent); }
  .board { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px; align-items:stretch; }
  .column { min-height:460px; background:rgba(25,30,42,.88); border:1px solid var(--line); border-radius:18px; padding:16px; box-shadow:var(--shadow); }
  .column-head { display:flex; justify-content:space-between; align-items:center; padding:2px 2px 15px; border-bottom:1px solid var(--line); margin-bottom:14px; }
  .heading { display:flex; align-items:center; gap:9px; font-size:16px; font-weight:800; }
  .tier-mark { width:9px;height:9px;border-radius:3px; }
  .count { color:var(--muted); font-size:12px; background:rgba(255,255,255,.06); padding:5px 9px; border-radius:20px; }
  .column[data-tier="life"] .tier-mark { background:var(--life); }
  .column[data-tier="watch"] .tier-mark { background:var(--watch); }
  .column[data-tier="no"] .tier-mark { background:var(--no); }
  .column[data-tier="pool"] .tier-mark { background:#8994aa; }
  .cards { display:grid; gap:10px; }
  .movie {
    width:100%; text-align:left; position:relative; overflow:hidden; cursor:pointer;
    color:var(--text); border:1px solid rgba(255,255,255,.12); border-radius:13px;
    padding:15px 14px 14px 17px; min-height:86px; transition:transform .16s, border-color .16s, filter .16s;
    background:var(--genre-bg);
  }
  .movie::before { content:""; position:absolute; left:0;top:0;bottom:0;width:4px;background:var(--genre); }
  .movie:hover { transform:translateY(-2px); border-color:rgba(255,255,255,.38); filter:brightness(1.08); }
  .movie:focus-visible, button:focus-visible { outline:3px solid #b8adff; outline-offset:3px; }
  .movie-title { display:block; font-weight:800; font-size:15px; line-height:1.45; padding-right:8px; }
  .movie-genre { display:inline-block; margin-top:8px; color:rgba(255,255,255,.76); font-size:11px; font-weight:700; letter-spacing:.02em; }
  .empty { border:1px dashed #3b4559; color:#7f8aa0; border-radius:12px; padding:23px 12px; text-align:center; font-size:12px; line-height:1.7; }
  .tier-actions { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  .tier-actions button {
    border:1px solid var(--line); background:#252d3d; color:#dfe5f2; border-radius:8px;
    padding:6px 8px; font-size:11px; cursor:pointer;
  }
  .tier-actions button:hover { background:#343e53; }
  .tier-actions .selected { border-color:var(--accent); color:#c9c0ff; }
  .footer { margin-top:20px; color:#7f8aa0; font-size:12px; display:flex; justify-content:space-between; gap:15px; }
  .reset { border:1px solid var(--line); background:transparent; color:#aeb8ca; border-radius:9px; padding:8px 12px; cursor:pointer; }
  .reset:hover { background:rgba(255,255,255,.06); color:white; }
  @media (max-width:1050px) { .board { grid-template-columns:repeat(2,minmax(0,1fr)); } .wrap{padding:26px 22px;} }
  @media (max-width:620px) { header{display:block;} .summary{margin-top:18px;} .board{grid-template-columns:1fr;} .column{min-height:180px;} .wrap{padding:22px 14px;} .footer{display:block;} .reset{margin-top:10px;} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">MY MOVIE COLLECTION</div>
      <h1>나의 영화 티어리스트</h1>
      <p class="subtitle">감상한 영화를 나만의 기준으로 분류해 보세요.</p>
    </div>
    <div class="summary" aria-live="polite">
      <span>전체 영화 <b id="totalCount">8</b></span>
      <span>분류 완료 <b id="doneCount">0</b></span>
    </div>
  </header>

  <p class="guide"><i class="dot"></i> 영화 카드를 누른 다음 원하는 등급을 선택하세요. 이미 분류한 영화도 언제든 다시 옮길 수 있습니다.</p>

  <main class="board" aria-label="영화 티어리스트">
    <section class="column" data-tier="pool">
      <div class="column-head"><div class="heading"><i class="tier-mark"></i>미분류</div><span class="count" id="count-pool">8편</span></div>
      <div class="cards" id="cards-pool"></div>
    </section>
    <section class="column" data-tier="life">
      <div class="column-head"><div class="heading"><i class="tier-mark"></i>인생영화</div><span class="count" id="count-life">0편</span></div>
      <div class="cards" id="cards-life"></div>
    </section>
    <section class="column" data-tier="watch">
      <div class="column-head"><div class="heading"><i class="tier-mark"></i>볼 만함</div><span class="count" id="count-watch">0편</span></div>
      <div class="cards" id="cards-watch"></div>
    </section>
    <section class="column" data-tier="no">
      <div class="column-head"><div class="heading"><i class="tier-mark"></i>비추</div><span class="count" id="count-no">0편</span></div>
      <div class="cards" id="cards-no"></div>
    </section>
  </main>

  <div class="footer">
    <span>※ 한 등급 안에서의 순서는 별도로 정하지 않습니다. 분류 결과는 이 페이지를 닫으면 저장되지 않습니다.</span>
    <button class="reset" id="resetBtn" type="button">전체 분류 초기화</button>
  </div>
</div>
<script>
const movies = [
  { id:1, title:"기생충", genre:"드라마 · 스릴러", color:"#b77c5c", bg:"#49332f" },
  { id:2, title:"인터스텔라", genre:"SF · 모험", color:"#6fa9d8", bg:"#253d55" },
  { id:3, title:"라라랜드", genre:"로맨스 · 뮤지컬", color:"#d58eb8", bg:"#50334d" },
  { id:4, title:"센과 치히로의 행방불명", genre:"애니메이션 · 판타지", color:"#80b99a", bg:"#29483d" },
  { id:5, title:"어벤져스: 엔드게임", genre:"액션 · SF", color:"#d18a64", bg:"#51382e" },
  { id:6, title:"범죄도시", genre:"액션 · 범죄", color:"#d77d78", bg:"#503235" },
  { id:7, title:"타이타닉", genre:"로맨스 · 재난", color:"#70b6c6", bg:"#29444d" },
  { id:8, title:"토이 스토리", genre:"애니메이션 · 코미디", color:"#c6ae69", bg:"#4b452d" }
];
const tiers = ["pool","life","watch","no"];
const tierNames = {pool:"미분류",life:"인생영화",watch:"볼 만함",no:"비추"};
const assignments = Object.fromEntries(movies.map(movie => [movie.id,"pool"]));
const selected = { id:null };

function makeCard(movie) {
  const card = document.createElement("div");
  card.className = "movie";
  card.style.setProperty("--genre", movie.color);
  card.style.setProperty("--genre-bg", movie.bg);
  card.tabIndex = 0;
  card.setAttribute("role","group");
  card.setAttribute("aria-label", movie.title + ", " + movie.genre);
  const title = document.createElement("span");
  title.className = "movie-title";
  title.textContent = movie.title;
  const genre = document.createElement("span");
  genre.className = "movie-genre";
  genre.textContent = movie.genre;
  card.append(title,genre);

  const actions = document.createElement("div");
  actions.className = "tier-actions";
  actions.setAttribute("aria-label", movie.title + " 등급 선택");
  tiers.forEach(tier => {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = tierNames[tier];
    if (assignments[movie.id] === tier) button.classList.add("selected");
    button.addEventListener("click", event => {
      event.stopPropagation();
      assignments[movie.id] = tier;
      render();
    });
    actions.appendChild(button);
  });
  card.appendChild(actions);
  card.addEventListener("click", () => {
    selected.id = selected.id === movie.id ? null : movie.id;
    render();
  });
  card.addEventListener("keydown", event => {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      selected.id = selected.id === movie.id ? null : movie.id;
      render();
    }
  });
  if (selected.id === movie.id) card.style.outline = "2px solid #b8adff";
  return card;
}

function render() {
  tiers.forEach(tier => {
    const container = document.getElementById("cards-" + tier);
    container.replaceChildren();
    const items = movies.filter(movie => assignments[movie.id] === tier);
    document.getElementById("count-" + tier).textContent = items.length + "편";
    if (!items.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = tier === "pool" ? "모든 영화를 분류했습니다." : "영화 카드를 이 등급으로 옮겨 보세요.";
      container.appendChild(empty);
    } else {
      items.forEach(movie => container.appendChild(makeCard(movie)));
    }
  });
  const done = movies.filter(movie => assignments[movie.id] !== "pool").length;
  document.getElementById("doneCount").textContent = done;
}
document.getElementById("resetBtn").addEventListener("click", () => {
  movies.forEach(movie => assignments[movie.id] = "pool");
  selected.id = null;
  render();
});
render();
</script>
</body>
</html>
